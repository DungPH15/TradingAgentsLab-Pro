name: Daily Trading Analysis

on:
  schedule:
    # Lịch chạy tự động mỗi ngày vào lúc 7:00 sáng (UTC) -> tương ứng 14:00 giờ Việt Nam
    - cron: '0 7 * * *'
  workflow_dispatch: # Cho phép chạy thủ công bất cứ lúc nào từ giao diện GitHub

jobs:
  run-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r engine/requirements.txt

      - name: Run Analysis Script
        env:
          GEMINI_API_KEY: ${
  { secrets.GEMINI_API_KEY }}
          # Thêm các biến môi trường khác nếu engine yêu cầu (ví dụ: các API key tài chính khác)
        run: |
          # Đường dẫn lệnh chạy script chính của engine phân tích (điều chỉnh lại tên file script thực tế trong thư mục engine nếu cần)
          python engine/main.py
